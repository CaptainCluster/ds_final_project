<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a reservation</title>
    <link rel="stylesheet" href="reservationstyle.css">
</head>
<body class="reservation">
    <div class="container">
   <form action="time1.html" autocomplete="off" class="form"> 
        <p class="title">Photographer Consult</p>
        <p class="message"></p>

        <div class="form-group">
            <label>
                <span>Full Name</span>
                <input type="text" value="Jane Doe" required>
            </label>
        </div>

        <div class="form-group">
            <label>
                <span>E-mail Address</span>
                <input type="text" value="jane.doe@example.com" required>
            </label>
        </div>

        <div class="form-group">
            <label>
                <span>List of Skills</span>
                <input type="text" value="Taking nature photos." required>
            </label>
        </div>

        <div class="form-group">
            <label>
                <span>Description</span>
                <textarea class="descriptionbox" required>Master your photography skills with personalized coaching. Learn camera settings, lighting, composition, and editing.</textarea>
            </label>
        </div>        
        <button class="submit">Reservation times</button>
    </form>
    <form action="time2.html" autocomplete="off" class="form"> 
        <p class="title">Video Editor Consult</p>
        <p class="message"></p>

        <div class="form-group">
            <label>
                <span>Full Name</span>
                <input type="text" value="John Smith" required>
            </label>
        </div>

        <div class="form-group">
            <label>
                <span>E-mail Address</span>
                <input type="text" value="john.smith@example.com" required>
            </label>
        </div>

        <div class="form-group">
            <label>
                <span>List of Skills</span>
                <input type="text" value="Editing video clips for content creators." required>
            </label>
        </div>

        <div class="form-group">
            <label>
                <span>Description</span>
                <textarea class="descriptionbox" required>Learn professional video editing techniques to create stunning projects. Get help with cutting footage, transitions, effects, color correction, sound design, and more.</textarea>
            </label>
        </div>        

        <button class="submit">Reservation times</button>
    </form>

    <form action="time3.html" autocomplete="off" class="form"> 
        <p class="title">Wellness and Fitness Consult</p>
        <p class="message"></p>

        <div class="form-group">
            <label>
                <span>Full Name</span>
                <input type="text" value="Alex Johnson" required>
            </label>
        </div>

        <div class="form-group">
            <label>
                <span>E-mail Address</span>
                <input type="text" value="alex.johnsonh@example.com" required>
            </label>
        </div>

        <div class="form-group">
            <label>
                <span>List of Skills</span>
                <input type="text" value="Improving people's fitness programs" required>
            </label>
        </div>

        <div class="form-group">
            <label>
                <span>Description</span>
                <textarea class="descriptionbox" required>Personalized fitness programs built for your lifestyle and goals. Get expert advice on strength, cardio, flexibility, and nutrition.</textarea>
            </label>
        </div>        

        <button class="submit">Reservation times</button>
    </form>
    </div>
</body>
</html>
